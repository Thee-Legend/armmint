name: Sync from upstream

# Keeps this deploy fork fast-forwarded to Spectra010s/armmint main.
# Railway watches this repo, so merges upstream reach deployment automatically.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward to upstream
        run: |
          git remote add upstream https://github.com/Spectra010s/armmint.git || true
          git fetch upstream main
          git checkout main
          if git merge --ff-only upstream/main; then
            git push origin main
          else
            echo "main has diverged; manual sync required."
            exit 1
          fi
